<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Admin Panel | Harold Trinidad Saxophonist</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <style>
    body {
      background: #1C1917;
      color: #FFFFFF;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }
    .admin-header {
      background: #262320;
      border-bottom: 2px solid var(--accent-gold);
      padding: 1.25rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }
    .admin-nav {
      display: flex;
      gap: 0.5rem;
      margin: 2rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      overflow-x: auto;
    }
    .admin-tab {
      padding: 0.85rem 1.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-bottom: none;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      color: var(--text-light-muted);
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition-fast);
      white-space: nowrap;
    }
    .admin-tab.active {
      background: var(--accent-gold);
      color: var(--primary-dark);
      border-color: var(--accent-gold);
    }
    .tab-content {
      display: none;
      background: #262320;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      margin-bottom: 3rem;
      box-shadow: var(--shadow-lg);
    }
    @media (max-width: 768px) {
      .tab-content {
        padding: 1.25rem;
      }
      .admin-nav {
        gap: 0.25rem;
      }
      .admin-tab {
        padding: 0.6rem 0.85rem;
        font-size: 0.82rem;
      }
      .save-bar {
        padding: 0.75rem 0;
      }
    }
    .tab-content.active {
      display: block;
    }
    .form-group-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .admin-section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      color: var(--accent-gold);
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      padding-bottom: 0.5rem;
    }
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      background: #1C1917;
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .item-row-info {
      flex-grow: 1;
    }
    .item-row-actions {
      display: flex;
      gap: 0.5rem;
    }
    .btn-sm {
      padding: 0.4rem 0.85rem;
      font-size: 0.85rem;
    }
    .btn-danger {
      background: #dc2626;
      color: #FFFFFF;
      border: none;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .save-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(20, 18, 16, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 2px solid var(--accent-gold);
      padding: 0.85rem 0 calc(0.85rem + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
      z-index: 1000;
    }

    /* Hot-Toast / Toastify Notification Stack */
    .hot-toast-container {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: min(400px, calc(100vw - 2rem));
      width: 100%;
      pointer-events: none;
    }
    .hot-toast {
      pointer-events: auto;
      background: rgba(28, 25, 23, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #FFFFFF;
      border: 1px solid rgba(217, 180, 90, 0.45);
      border-radius: 12px;
      padding: 0.9rem 1.15rem;
      box-shadow: 0 18px 40px -8px rgba(0,0,0,0.65);
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      position: relative;
      overflow: hidden;
      animation: toastSlideIn 280ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .hot-toast.closing {
      animation: toastSlideOut 220ms ease forwards;
    }
    .hot-toast-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 0.1rem;
    }
    .hot-toast.success .hot-toast-icon { background: rgba(34, 197, 94, 0.2); color: #22c55e; border: 1px solid #22c55e; }
    .hot-toast.error .hot-toast-icon { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .hot-toast.info .hot-toast-icon { background: rgba(217, 180, 90, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); }
    .hot-toast-body { flex: 1; min-width: 0; }
    .hot-toast-title { font-weight: 700; font-size: 0.92rem; color: #FFFFFF; line-height: 1.3; }
    .hot-toast-msg { font-size: 0.82rem; color: var(--text-light-muted); margin-top: 0.2rem; line-height: 1.4; }
    .hot-toast-close {
      background: transparent;
      border: none;
      color: var(--text-light-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.2rem;
    }
    .hot-toast-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      background: var(--accent-gold);
      width: 100%;
      transform-origin: left;
      animation: toastProgress linear forwards;
    }
    .hot-toast.success .hot-toast-progress { background: #22c55e; }
    .hot-toast.error .hot-toast-progress { background: #ef4444; }
    @keyframes toastSlideIn {
      from { opacity: 0; transform: translateY(-16px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastSlideOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-12px) scale(0.95); }
    }
    @keyframes toastProgress {
      from { transform: scaleX(1); }
      to { transform: scaleX(0); }
    }

    /* Custom Confirm Modal */
    .confirm-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 10, 9, 0.82);
      backdrop-filter: blur(8px);
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }
    .confirm-modal-backdrop.active { display: flex; }
    .confirm-modal-box {
      background: #262320;
      border: 1px solid var(--accent-gold);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.7);
      text-align: center;
    }

    /* Mobile Responsive Admin Improvements */
    @media (max-width: 768px) {
      .admin-header-inner {
        flex-direction: column;
        align-items: stretch !important;
        gap: 0.85rem;
      }
      .admin-header-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .admin-header-actions .btn {
        flex: 1;
        justify-content: center;
        font-size: 0.78rem;
        padding: 0.5rem 0.65rem;
      }
      .form-group[style*="span 2"] {
        grid-column: span 1 !important;
      }
      .item-row {
        flex-direction: column;
        align-items: flex-start;
      }
      .item-row-actions {
        width: 100%;
        justify-content: flex-end;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 0.65rem;
      }
      .save-bar-inner {
        flex-direction: column;
        gap: 0.65rem;
        text-align: center;
      }
      .save-bar-actions {
        width: 100%;
        display: flex;
        gap: 0.5rem;
      }
      .save-bar-actions .btn {
        flex: 1;
        padding: 0.7rem 0.85rem !important;
        font-size: 0.85rem;
      }
      .hot-toast-container {
        top: 0.75rem;
        right: 0.75rem;
        left: 0.75rem;
        max-width: none;
      }
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

  <!-- OTP SECURITY LOCK OVERLAY -->
  <div id="otp-lock-overlay" style="position: fixed; inset: 0; background: rgba(28, 25, 23, 0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 1.5rem;">
    <div style="background: #262320; border: 2px solid var(--accent-gold); border-radius: var(--radius-lg); padding: 2.5rem; max-width: 480px; width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.8); text-align: center;">
      
      <div style="width: 64px; height: 64px; border-radius: 50%; background: rgba(212, 175, 55, 0.15); border: 2px solid var(--accent-gold); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; color: var(--accent-gold);">
        <svg class="svg-icon" viewBox="0 0 24 24" style="width: 32px; height: 32px;"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      </div>

      <h2 style="font-family: 'Playfair Display', serif; color: #FFFFFF; font-size: 1.65rem; margin-bottom: 0.5rem;">Site Admin Security Lock</h2>
      <p style="font-size: 0.9rem; color: var(--text-light-muted); margin-bottom: 1.5rem;">
        Enter the 6-digit OTP verification code sent to your email address:
        <br><strong style="color: var(--accent-gold);" id="target-admin-email-display">haroldcalo.trinidad@gmail.com</strong>
      </p>

      <!-- Action 1: Send OTP Button -->
      <div style="margin-bottom: 1.5rem;">
        <button id="send-otp-btn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 0.95rem;">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <span>Send 6-Digit OTP Code to Gmail</span>
        </button>
        <div id="otp-timer-msg" style="font-size: 0.8rem; color: var(--text-light-muted); margin-top: 0.5rem; display: none;"></div>
      </div>

      <!-- Action 2: OTP Input & Verification -->
      <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
        <label class="form-label" style="text-align: center; display: block;">Enter 6-Digit Code</label>
        <input type="text" id="otp-code-input" class="form-input" placeholder="e.g. 849201" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.25em; font-weight: 700; font-family: monospace;">
      </div>

      <button id="verify-otp-btn" class="btn btn-secondary" style="width: 100%; border: 2px solid var(--accent-gold); color: var(--accent-gold); padding: 0.85rem; font-size: 1rem;">
        <span>Verify & Access Admin Dashboard</span>
      </button>

      <div id="otp-status-msg" style="margin-top: 1rem; font-size: 0.85rem; font-weight: 600;"></div>
    </div>
  </div>

  <!-- Dashboard markup lives in an inert template: it is NOT in the DOM until OTP verification passes -->
  <template id="admin-app-template">
  <!-- Header -->
  <header class="admin-header">
    <div class="admin-container admin-header-inner" style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <img src="profile/harold-soprano.jpg" alt="Harold Trinidad" style="width: 44px; height: 44px; border-radius: 50%; object-fit: cover; object-position: 55% 22%; border: 2px solid var(--accent-gold); flex-shrink: 0;">
        <div>
          <h1 style="font-size: 1.2rem; margin: 0; font-family: 'Playfair Display', serif; color: #FFFFFF;">Harold Trinidad Website Admin</h1>
          <p style="font-size: 0.78rem; color: var(--accent-gold); margin: 0;">Protected by OTP (haroldcalo.trinidad@gmail.com)</p>
        </div>
      </div>
      <div class="admin-header-actions" style="display: flex; gap: 0.65rem;">
        <button id="header-clear-cache-btn" class="btn btn-secondary btn-sm" style="border: 1px solid var(--accent-gold); color: var(--accent-gold);">
          <span>⚡ Clear Cache & Sync</span>
        </button>
        <button id="lock-admin-btn" class="btn btn-secondary btn-sm" style="border: 1px solid rgba(220,38,38,0.5); color: #ef4444;">
          <span>🔒 Lock Session</span>
        </button>
        <a href="index.html" class="btn btn-secondary btn-sm" target="_blank">
          <span>View Live Website</span>
          <svg class="svg-icon" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="admin-container" style="padding-bottom: 100px;">
    <!-- Tab Navigation -->
    <div class="admin-nav">
      <button class="admin-tab active" data-tab="tab-profile">👤 Artist Info & Contact</button>
      <button class="admin-tab" data-tab="tab-rates">💰 Packages & Rates</button>
      <button class="admin-tab" data-tab="tab-videos">🎷 YouTube Videos (15)</button>
      <button class="admin-tab" data-tab="tab-reviews">💬 Client Reviews (5)</button>
      <button class="admin-tab" data-tab="tab-export">⚙️ Backup & Export</button>
    </div>

    <!-- TAB 1: ARTIST PROFILE & CONTACT INFO -->
    <div class="tab-content active" id="tab-profile">
      <h2 class="admin-section-title">Artist Information & Contact Settings</h2>
      
      <div class="form-group-grid">
        <div class="form-group">
          <label class="form-label">Artist Full Name</label>
          <input type="text" id="cfg-artist-name-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Tagline / Slogan</label>
          <input type="text" id="cfg-artist-tagline-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Direct Email</label>
          <input type="email" id="cfg-artist-email-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" id="cfg-artist-phone-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Primary Coverage Area</label>
          <input type="text" id="cfg-artist-location-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Profile Photo Path</label>
          <input type="text" id="cfg-artist-photo-input" class="form-input">
        </div>
      </div>

      <h2 class="admin-section-title" style="margin-top: 2rem;">TikTok Video Embed in About Section</h2>
      <div class="form-group-grid">
        <div class="form-group" style="grid-column: span 2;">
          <label class="form-label">TikTok Embed iFrame URL</label>
          <input type="text" id="cfg-tiktok-embed-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">TikTok Direct Link</label>
          <input type="text" id="cfg-tiktok-link-input" class="form-input">
        </div>
      </div>
    </div>

    <!-- TAB 2: PACKAGES & RATES -->
    <div class="tab-content" id="tab-rates">
      <h2 class="admin-section-title">2026 Package Rates & Deposit Settings</h2>

      <div class="form-group-grid">
        <div class="form-group">
          <label class="form-label">Required Downpayment %</label>
          <input type="number" id="cfg-deposit-percent-input" class="form-input" min="1" max="100">
        </div>
        <div class="form-group">
          <label class="form-label">Pampanga Transport Fee (₱)</label>
          <input type="number" id="cfg-transport-fee-input" class="form-input">
        </div>
      </div>

      <h3 style="color: #FFFFFF; font-size: 1.2rem; margin: 1.5rem 0 1rem 0;">Package A (Church & Reception)</h3>
      <div class="form-group-grid">
        <div class="form-group">
          <label class="form-label">Package A Base Rate (₱)</label>
          <input type="number" id="cfg-pkga-base-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Package A Total Price (₱)</label>
          <input type="number" id="cfg-pkga-total-input" class="form-input">
        </div>
      </div>

      <h3 style="color: #FFFFFF; font-size: 1.2rem; margin: 1.5rem 0 1rem 0;">Package B (Single Location)</h3>
      <div class="form-group-grid">
        <div class="form-group">
          <label class="form-label">Package B Base Rate (₱)</label>
          <input type="number" id="cfg-pkgb-base-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Package B Total Price (₱)</label>
          <input type="number" id="cfg-pkgb-total-input" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Special Request Cover Price (₱)</label>
          <input type="number" id="cfg-cover-price-input" class="form-input">
        </div>
      </div>

      <h3 style="color: #FFFFFF; font-size: 1.2rem; margin: 1.5rem 0 1rem 0;">⛽ Fuel &amp; Driving Distance Calculator (Point A: Home Base)</h3>
      <div class="form-group-grid">
        <div class="form-group">
          <label class="form-label">Current Unleaded Gas Price (₱ / Liter)</label>
          <input type="number" step="0.5" id="cfg-gas-price-input" class="form-input" placeholder="e.g. 62">
        </div>
        <div class="form-group">
          <label class="form-label">Car Fuel Consumption (km / Liter)</label>
          <input type="number" step="0.5" id="cfg-fuel-eff-input" class="form-input" placeholder="e.g. 10">
        </div>
        <div class="form-group">
          <label class="form-label">Home Base Coordinates (Lat, Lng)</label>
          <input type="text" id="cfg-home-coords-input" class="form-input" placeholder="14.991115, 120.599693">
        </div>
        <div class="form-group">
          <label class="form-label">Home Base Google Maps Link</label>
          <input type="text" id="cfg-home-map-input" class="form-input" placeholder="https://maps.app.goo.gl/yRMzfz3Ki67d91im6">
        </div>
      </div>
    </div>

    <!-- TAB 3: YOUTUBE PERFORMANCE VIDEOS -->
    <div class="tab-content" id="tab-videos">
      <h2 class="admin-section-title">YouTube Performance Repertoire Videos</h2>
      
      <!-- Add New Video Form -->
      <div style="background: #1C1917; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--accent-gold); margin-bottom: 2rem;">
        <h3 style="margin-top:0; font-size: 1.1rem; color: var(--accent-gold);">+ Add New YouTube Performance Video</h3>
        <div class="form-group-grid" style="margin-bottom: 1rem;">
          <div class="form-group">
            <label class="form-label">Song Cover Title *</label>
            <input type="text" id="new-video-title" class="form-input" placeholder="e.g. Perfect - Saxophone Cover">
          </div>
          <div class="form-group">
            <label class="form-label">YouTube URL or Video ID *</label>
            <input type="text" id="new-video-id" class="form-input" placeholder="e.g. https://youtu.be/ShtHM_xGZwg or ShtHM_xGZwg">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" id="add-video-btn">+ Add Video to Repertoire</button>
      </div>

      <!-- Current Videos List -->
      <h3 style="font-size: 1.1rem; color: #FFFFFF;">Current Repertoire Videos (<span id="videos-count">0</span>)</h3>
      <p style="font-size: 0.85rem; color: var(--text-light-muted);">Top video is the default video played in the main player.</p>
      <div class="item-list" id="admin-video-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- TAB 4: CLIENT REVIEWS -->
    <div class="tab-content" id="tab-reviews">
      <h2 class="admin-section-title">Client Review Screenshots</h2>

      <!-- Add New Review Form -->
      <div style="background: #1C1917; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--accent-gold); margin-bottom: 2rem;">
        <h3 style="margin-top:0; font-size: 1.1rem; color: var(--accent-gold);">+ Add New Review Screenshot</h3>
        <div class="form-group-grid" style="margin-bottom: 1rem;">
          <div class="form-group">
            <label class="form-label">Review Image Path *</label>
            <input type="text" id="new-review-image" class="form-input" placeholder="e.g. reviews/Screenshot_20260730_140119_Facebook.jpg">
          </div>
          <div class="form-group">
            <label class="form-label">Review Title / Caption</label>
            <input type="text" id="new-review-title" class="form-input" placeholder="e.g. Facebook Recommendation #6">
          </div>
        </div>
        <button class="btn btn-primary btn-sm" id="add-review-btn">+ Add Review Screenshot</button>
      </div>

      <!-- Current Reviews List -->
      <h3 style="font-size: 1.1rem; color: #FFFFFF;">Current Client Reviews (<span id="reviews-count">0</span>)</h3>
      <div class="item-list" id="admin-review-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- TAB 5: BACKUP & EXPORT -->
    <div class="tab-content" id="tab-export">
      <h2 class="admin-section-title">Cache Control, Backup & Reset Settings</h2>

      <div style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 640px;">
        <div style="background: #1C1917; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid var(--accent-gold);">
          <h3 style="color: var(--accent-gold); margin-top:0;">⚡ Clear Browser Cache & Force Sync</h3>
          <p style="font-size: 0.9rem; color: var(--text-light-muted);">
            Purge browser CacheStorage, bump the asset cache-buster timestamp, and automatically reload any open website tabs with your latest updates.
          </p>
          <button class="btn btn-primary btn-sm" id="tab-clear-cache-btn">Clear Cache & Sync Open Tabs</button>

        <div style="background: #1C1917; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(217,180,90,0.45);">
          <h3 style="color: var(--accent-gold); margin-top:0;">🌐 Global Cross-Device Sync (Optional GitHub Fine-Grained Token)</h3>
          <p style="font-size: 0.88rem; color: var(--text-light-muted);">
            Want your Admin edits to automatically update <strong>all phones and visitors worldwide</strong> without downloading <code style="color: var(--accent-gold);">config.js</code>? Paste a GitHub Fine-Grained Personal Access Token (scoped only to <code style="color: var(--accent-gold);">haroldprofile/saxophonist</code> → Contents: Read &amp; Write). It is stored strictly inside this browser only and never exposed publicly.
          </p>
          <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem;">
            <input type="password" id="github-pat-input" class="form-input" placeholder="github_pat_..." style="flex: 1; min-width: 220px;">
            <button type="button" class="btn btn-primary btn-sm" id="save-gh-pat-btn">Save Token</button>
            <button type="button" class="btn btn-secondary btn-sm" id="clear-gh-pat-btn">Remove</button>

        <div style="background: #1C1917; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(255,255,255,0.1);">
          <h3 style="color: var(--accent-gold); margin-top:0;">📥 Export Updated config.js File</h3>
          <p style="font-size: 0.9rem; color: var(--text-light-muted);">
            Download a permanently updated <code style="color: var(--accent-gold);">config.js</code> file containing all your latest videos, rates, and reviews to commit & push to GitHub so every visitor worldwide sees your changes.
          </p>
          <button class="btn btn-primary btn-sm" id="export-config-btn">Download Updated config.js</button>
        </div>

        <div style="background: #1C1917; padding: 1.5rem; border-radius: var(--radius-md); border: 1px solid rgba(220,38,38,0.4);">
          <h3 style="color: #ef4444; margin-top:0;">⚠️ Reset to Default Configuration</h3>
          <p style="font-size: 0.9rem; color: var(--text-light-muted);">
            Clear all live localStorage overrides and restore the original default settings from <code style="color: var(--accent-gold);">config.js</code>.
          </p>
          <button class="btn btn-danger btn-sm" id="reset-config-btn">Reset All Settings to Default</button>
        </div>

  </main>

  <!-- Sticky Save Bar -->
  <div class="save-bar">
    <div class="admin-container save-bar-inner" style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 0.88rem; color: var(--text-light-muted);">
        <strong style="color: var(--accent-gold);">Website Maintenance System</strong> — Saves & auto-clears cache immediately.
      </div>
      <div class="save-bar-actions" style="display: flex; gap: 0.75rem;">
        <button class="btn btn-secondary" id="bar-clear-cache-btn" style="border: 1px solid var(--accent-gold); color: var(--accent-gold); padding: 0.75rem 1.25rem;">
          <span>⚡ Clear Cache</span>
        </button>
        <button class="btn btn-primary" id="save-all-btn" style="padding: 0.75rem 1.75rem;">
          <svg class="svg-icon" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span>Save & Sync Live</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Container & Custom Confirm Modal -->
  <div id="hot-toast-container" class="hot-toast-container" aria-live="polite"></div>
  <div id="confirm-modal" class="confirm-modal-backdrop" role="dialog" aria-modal="true">
    <div class="confirm-modal-box">
      <h3 id="confirm-modal-title" style="color: #FFFFFF; font-family: 'Playfair Display', serif; font-size: 1.35rem; margin-bottom: 0.5rem;">Confirm Action</h3>
      <p id="confirm-modal-msg" style="color: var(--text-light-muted); font-size: 0.92rem; margin-bottom: 1.5rem;"></p>
      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <button id="confirm-cancel-btn" class="btn btn-secondary btn-sm" style="flex: 1;">Cancel</button>
        <button id="confirm-ok-btn" class="btn btn-danger btn-sm" style="flex: 1;">Confirm</button>
      </div>
    </div>
  </div>
  </template>

  <script>
    // Local copy of active config
    let activeConfig = JSON.parse(JSON.stringify(window.SITE_CONFIG));

    // Try loading saved config from localStorage
    const saved = localStorage.getItem('HAROLD_SITE_CONFIG');
    if (saved) {
      try {
        activeConfig = JSON.parse(saved);
      } catch(e){}
    }

    function bootAdmin() {
    if (window.__adminBooted) return;
    window.__adminBooted = true;
    document.body.appendChild(document.getElementById('admin-app-template').content.cloneNode(true));
    document.getElementById('lock-admin-btn').addEventListener('click', () => {
      sessionStorage.removeItem('HAROLD_ADMIN_SESSION_EXP');
      location.reload();
    });

    // Tab Switcher
    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        tab.classList.add('active');
        const target = tab.getAttribute('data-tab');
        document.getElementById(target)?.classList.add('active');
      });
    });

    /* ==========================================
       REACT HOT TOAST / TOASTIFY NOTIFICATION ENGINE
       ========================================== */
    const siteSyncChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('harold_site_sync') : null;

    function showToast(title, msg = '', type = 'success', duration = 3800) {
      const container = document.getElementById('hot-toast-container');
      if (!container) return;

      const icons = {
        success: '✓',
        error: '✕',
        info: '⚡'
      };

      const toast = document.createElement('div');
      toast.className = `hot-toast toast-${type}`;
      toast.style.setProperty('--toast-duration', `${duration}ms`);
      toast.innerHTML = `
        <div class="hot-toast-icon">${icons[type] || '✓'}</div>
        <div class="hot-toast-content">
          <div class="hot-toast-title">${title}</div>
          ${msg ? `<div class="hot-toast-msg">${msg}</div>` : ''}
        </div>
        <button class="hot-toast-close" aria-label="Close">×</button>
        <div class="hot-toast-progress"></div>
      `;

      const removeToast = () => {
        if (toast.classList.contains('toast-leave')) return;
        toast.classList.add('toast-leave');
        setTimeout(() => toast.remove(), 260);
      };

      toast.querySelector('.hot-toast-close').addEventListener('click', removeToast);
      container.appendChild(toast);
      setTimeout(removeToast, duration);
    }

    function showConfirm(title, message, onConfirm) {
      const modal = document.getElementById('confirm-modal');
      const titleEl = document.getElementById('confirm-modal-title');
      const msgEl = document.getElementById('confirm-modal-msg');
      const cancelBtn = document.getElementById('confirm-cancel-btn');
      const okBtn = document.getElementById('confirm-ok-btn');

      if (!modal) {
        if (onConfirm) onConfirm();
        return;
      }

      titleEl.textContent = title;
      msgEl.textContent = message;
      modal.classList.add('active');

      const cleanup = () => {
        modal.classList.remove('active');
        cancelBtn.onclick = null;
        okBtn.onclick = null;
      };

      cancelBtn.onclick = cleanup;
      okBtn.onclick = () => {
        cleanup();
        if (onConfirm) onConfirm();
      };
    }

    // Clear System Cache & Broadcast Live Sync
    async function clearSystemCache(silent = false) {
      try {
        const version = Date.now().toString();
        localStorage.setItem('HAROLD_CACHE_VERSION', version);
        localStorage.setItem('HAROLD_SITE_CONFIG', JSON.stringify(activeConfig));

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
        }

        if (siteSyncChannel) {
          siteSyncChannel.postMessage({ type: 'CACHE_CLEARED', version });
        }

        if (!silent) {
          showToast(
            'Cache Cleared & System Synced!',
            'Browser cache purged & all open website tabs updated automatically.',
            'info'
          );
        }
      } catch (err) {
        console.warn('Cache purge warning:', err);
        if (!silent) {
          showToast('Cache Sync Completed', 'Local configuration synced with open tabs.', 'info');
        }
      }
    }

    ['header-clear-cache-btn', 'tab-clear-cache-btn', 'bar-clear-cache-btn'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) btn.addEventListener('click', () => clearSystemCache(false));
    });

    // Populate Form Inputs
    function populateForm() {
      const a = activeConfig.artist || {};
      const r = activeConfig.rates || {};

      document.getElementById('cfg-artist-name-input').value = a.name || '';
      document.getElementById('cfg-artist-tagline-input').value = a.tagline || '';
      document.getElementById('cfg-artist-email-input').value = a.email || '';
      document.getElementById('cfg-artist-phone-input').value = a.phone || '';
      document.getElementById('cfg-artist-location-input').value = a.location || '';
      document.getElementById('cfg-artist-photo-input').value = a.profilePhoto || '';
      document.getElementById('cfg-tiktok-embed-input').value = a.tiktokEmbedUrl || '';
      document.getElementById('cfg-tiktok-link-input').value = a.tiktokProfileUrl || '';

      document.getElementById('cfg-deposit-percent-input').value = r.depositPercentage || 30;
      document.getElementById('cfg-transport-fee-input').value = r.transportFeePampanga || 500;
      document.getElementById('cfg-cover-price-input').value = r.specialCover || 1000;
      document.getElementById('cfg-gas-price-input').value = r.gasPricePerLiter || 62;
      document.getElementById('cfg-fuel-eff-input').value = r.fuelEfficiencyKmPerL || 10;
      document.getElementById('cfg-home-coords-input').value = `${r.homeBaseLat || 14.991115}, ${r.homeBaseLng || 120.599693}`;
      document.getElementById('cfg-home-map-input').value = r.homeBaseMapUrl || 'https://maps.app.goo.gl/yRMzfz3Ki67d91im6';
      
      if (r.packageA) {
        document.getElementById('cfg-pkga-base-input').value = r.packageA.basePrice || 8000;
        document.getElementById('cfg-pkga-total-input').value = r.packageA.totalPrice || 8500;
      }
      if (r.packageB) {
        document.getElementById('cfg-pkgb-base-input').value = r.packageB.basePrice || 5000;
        document.getElementById('cfg-pkgb-total-input').value = r.packageB.totalPrice || 5500;
      }

      renderVideosList();
      renderReviewsList();
    }

    // Render Videos List
    function renderVideosList() {
      const container = document.getElementById('admin-video-list');
      const countEl = document.getElementById('videos-count');
      const videos = activeConfig.videos || [];
      countEl.textContent = videos.length;

      container.innerHTML = '';
      videos.forEach((v, idx) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div style="display: flex; align-items: center; gap: 1rem; flex-grow: 1;">
            <img src="https://img.youtube.com/vi/${v.videoId}/hqdefault.jpg" style="width: 70px; height: 45px; border-radius: 4px; object-fit: cover;">
            <div class="item-row-info">
              <strong style="color: #FFFFFF; font-size: 0.95rem;">${idx + 1}. ${v.title}</strong>
              <div style="font-size: 0.8rem; color: var(--accent-gold);">ID: ${v.videoId}</div>
            </div>
          </div>
          <div class="item-row-actions">
            <button class="btn btn-secondary btn-sm" onclick="moveVideo(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
            <button class="btn btn-secondary btn-sm" onclick="moveVideo(${idx}, 1)" ${idx === videos.length - 1 ? 'disabled' : ''}>▼</button>
            <button class="btn btn-danger btn-sm" onclick="deleteVideo(${idx})">Delete</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Move Video
    window.moveVideo = function(index, direction) {
      const videos = activeConfig.videos;
      const target = index + direction;
      if (target >= 0 && target < videos.length) {
        const temp = videos[index];
        videos[index] = videos[target];
        videos[target] = temp;
        renderVideosList();
        showToast('Video Reordered', `Moved "${videos[target].title}" to position #${target + 1}. Click Save All to publish.`, 'info', 2500);
      }
    };

    // Delete Video
    window.deleteVideo = function(index) {
      const videoTitle = activeConfig.videos[index]?.title || 'this video';
      showConfirm(
        'Remove Performance Video?',
        `Are you sure you want to remove "${videoTitle}" from the playlist?`,
        () => {
          activeConfig.videos.splice(index, 1);
          renderVideosList();
          showToast('Video Removed', `"${videoTitle}" removed. Click Save All Changes to apply.`, 'info');
        }
      );
    };

    // Add Video
    document.getElementById('add-video-btn').addEventListener('click', () => {
      const titleInput = document.getElementById('new-video-title');
      const idInput = document.getElementById('new-video-id');
      const title = titleInput.value.trim();
      let rawId = idInput.value.trim();

      if (!title || !rawId) {
        showToast('Missing Video Info', 'Please fill in both the song title and YouTube URL or Video ID.', 'error');
        return;
      }

      // Extract ID from full URL if needed
      let videoId = rawId;
      if (rawId.includes('youtu.be/')) {
        videoId = rawId.split('youtu.be/')[1].split('?')[0];
      } else if (rawId.includes('youtube.com/watch?v=')) {
        videoId = rawId.split('watch?v=')[1].split('&')[0];
      } else if (rawId.includes('youtube.com/shorts/')) {
        videoId = rawId.split('shorts/')[1].split('?')[0];
      }

      activeConfig.videos.push({ title, videoId });
      titleInput.value = '';
      idInput.value = '';
      renderVideosList();
      showToast('Video Added!', `"${title}" added to playlist. Click Save All Changes to sync live.`, 'success');
    });

    // Render Reviews List
    function renderReviewsList() {
      const container = document.getElementById('admin-review-list');
      const countEl = document.getElementById('reviews-count');
      const reviews = activeConfig.reviews || [];
      countEl.textContent = reviews.length;

      container.innerHTML = '';
      reviews.forEach((r, idx) => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
          <div style="display: flex; align-items: center; gap: 1rem; flex-grow: 1;">
            <img src="${r.image}" style="width: 50px; height: 50px; border-radius: 4px; object-fit: cover;">
            <div class="item-row-info">
              <strong style="color: #FFFFFF; font-size: 0.95rem;">${r.title}</strong>
              <div style="font-size: 0.8rem; color: var(--text-light-muted);">${r.image}</div>
            </div>
          </div>
          <div class="item-row-actions">
            <button class="btn btn-danger btn-sm" onclick="deleteReview(${idx})">Delete</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    // Delete Review
    window.deleteReview = function(index) {
      showConfirm(
        'Remove Review Screenshot?',
        `Remove review screenshot #${index + 1} from client feedback?`,
        () => {
          activeConfig.reviews.splice(index, 1);
          renderReviewsList();
          showToast('Review Removed', `Review screenshot #${index + 1} removed. Click Save All Changes to apply.`, 'info');
        }
      );
    };

    // Add Review
    document.getElementById('add-review-btn').addEventListener('click', () => {
      const imgInput = document.getElementById('new-review-image');
      const titleInput = document.getElementById('new-review-title');
      const image = imgInput.value.trim();
      const title = titleInput.value.trim() || `Client Recommendation #${activeConfig.reviews.length + 1}`;

      if (!image) {
        showToast('Missing Image Path', 'Please enter a review screenshot image path (e.g. recommendations/file.jpg).', 'error');
        return;
      }

      activeConfig.reviews.push({ title, category: "Client Review Feedback", image });
      imgInput.value = '';
      titleInput.value = '';
      renderReviewsList();
      showToast('Review Screenshot Added!', `"${title}" added. Click Save All Changes to sync live.`, 'success');
    });

    // Save All Changes Live + Auto Clear Cache & Broadcast
    document.getElementById('save-all-btn').addEventListener('click', async () => {
      // Read current form inputs
      activeConfig.artist.name = document.getElementById('cfg-artist-name-input').value.trim();
      activeConfig.artist.tagline = document.getElementById('cfg-artist-tagline-input').value.trim();
      activeConfig.artist.email = document.getElementById('cfg-artist-email-input').value.trim();
      activeConfig.artist.phone = document.getElementById('cfg-artist-phone-input').value.trim();
      activeConfig.artist.location = document.getElementById('cfg-artist-location-input').value.trim();
      activeConfig.artist.profilePhoto = document.getElementById('cfg-artist-photo-input').value.trim();
      activeConfig.artist.tiktokEmbedUrl = document.getElementById('cfg-tiktok-embed-input').value.trim();
      activeConfig.artist.tiktokProfileUrl = document.getElementById('cfg-tiktok-link-input').value.trim();

      const depPct = parseInt(document.getElementById('cfg-deposit-percent-input').value, 10) || 30;
      const transFee = parseInt(document.getElementById('cfg-transport-fee-input').value, 10) || 500;
      const pkgaBase = parseInt(document.getElementById('cfg-pkga-base-input').value, 10) || 8000;
      const pkgaTotal = parseInt(document.getElementById('cfg-pkga-total-input').value, 10) || 8500;
      const pkgbBase = parseInt(document.getElementById('cfg-pkgb-base-input').value, 10) || 5000;
      const pkgbTotal = parseInt(document.getElementById('cfg-pkgb-total-input').value, 10) || 5500;

      const rawCoords = (document.getElementById('cfg-home-coords-input').value || '14.991115, 120.599693').split(',');
      const homeLat = parseFloat(rawCoords[0]) || 14.991115;
      const homeLng = parseFloat(rawCoords[1]) || 120.599693;

      activeConfig.rates = {
        specialCover: parseInt(document.getElementById('cfg-cover-price-input').value, 10) || 1000,
        depositPercentage: depPct,
        transportFeePampanga: transFee,
        gasPricePerLiter: parseFloat(document.getElementById('cfg-gas-price-input').value) || 62,
        fuelEfficiencyKmPerL: parseFloat(document.getElementById('cfg-fuel-eff-input').value) || 10,
        homeBaseLat: homeLat,
        homeBaseLng: homeLng,
        homeBaseMapUrl: document.getElementById('cfg-home-map-input').value.trim() || 'https://maps.app.goo.gl/yRMzfz3Ki67d91im6',
        packageA: {
          name: "Package A",
          subtitle: "Church & Reception Coverage (2 Sets / 2 Hours)",
          basePrice: pkgaBase,
          transportFee: transFee,
          totalPrice: pkgaTotal,
          depositAmount: Math.round(pkgaTotal * (depPct / 100))
        },
        packageB: {
          name: "Package B",
          subtitle: "Single Location Coverage (1 Set / 1 Hour)",
          basePrice: pkgbBase,
          transportFee: transFee,
          totalPrice: pkgbTotal,
          depositAmount: Math.round(pkgbTotal * (depPct / 100))
        }
      };

      // Save to localStorage & automatically bust cache + sync open tabs
      localStorage.setItem('HAROLD_SITE_CONFIG', JSON.stringify(activeConfig));
      await clearSystemCache(true);

      if (siteSyncChannel) {
        siteSyncChannel.postMessage({ type: 'CONFIG_UPDATED', timestamp: Date.now() });
      }

      // Optional Global GitHub Live Publish if fine-grained token is configured
      const ghPat = localStorage.getItem('HAROLD_GH_PAT');
      if (ghPat) {
        try {
          showToast('Publishing Globally to GitHub...', 'Syncing updated config.js to haroldprofile/saxophonist for all devices.', 'info', 2800);
          const apiUrl = 'https://api.github.com/repos/haroldprofile/saxophonist/contents/config.js';
          const getRes = await fetch(apiUrl, {
            headers: {
              'Authorization': `Bearer ${ghPat}`,
              'Accept': 'application/vnd.github+json'
            }
          });
          if (getRes.ok) {
            const fileMeta = await getRes.json();
            const code = `/**\n * HAROLD TRINIDAD - CENTRALIZED WEBSITE CONFIGURATION\n */\n\nwindow.SITE_CONFIG = ${JSON.stringify(activeConfig, null, 2)};\n`;
            const base64Content = btoa(unescape(encodeURIComponent(code)));
            const putRes = await fetch(apiUrl, {
              method: 'PUT',
              headers: {
                'Authorization': `Bearer ${ghPat}`,
                'Accept': 'application/vnd.github+json',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: 'chore(admin): live config update from Admin Dashboard',
                content: base64Content,
                sha: fileMeta.sha
              })
            });
            if (putRes.ok) {
              showToast('Published Worldwide & Cache Cleared!', 'Updated config.js committed to GitHub Pages — all devices will receive your update.', 'success', 5000);
              return;
            }
          }
          showToast('Saved Locally (GitHub Token Check Needed)', 'Saved on this device, but GitHub API returned an error. Check your token permissions in Tab 5.', 'error', 5000);
          return;
        } catch (err) {
          console.warn('GitHub sync error:', err);
        }
      }

      showToast(
        'Saved & Cache Auto-Cleared!',
        'All changes are live on this browser. Use Tab 5 to publish globally to all devices.',
        'success'
      );
    });

    // GitHub Fine-Grained PAT Controls
    const ghPatInput = document.getElementById('github-pat-input');
    const saveGhPatBtn = document.getElementById('save-gh-pat-btn');
    const clearGhPatBtn = document.getElementById('clear-gh-pat-btn');
    if (ghPatInput) {
      ghPatInput.value = localStorage.getItem('HAROLD_GH_PAT') || '';
    }
    if (saveGhPatBtn && ghPatInput) {
      saveGhPatBtn.addEventListener('click', () => {
        const val = ghPatInput.value.trim();
        if (!val) {
          showToast('Empty Token', 'Please paste a valid GitHub Fine-Grained Token.', 'error');
          return;
        }
        localStorage.setItem('HAROLD_GH_PAT', val);
        showToast('Global Sync Token Saved!', 'Clicking Save All Changes will now automatically publish to GitHub for all devices.', 'success');
      });
    }
    if (clearGhPatBtn && ghPatInput) {
      clearGhPatBtn.addEventListener('click', () => {
        localStorage.removeItem('HAROLD_GH_PAT');
        ghPatInput.value = '';
        showToast('Token Removed', 'Removed GitHub token from this browser.', 'info');
      });
    }

    // Reset Config
    document.getElementById('reset-config-btn').addEventListener('click', () => {
      showConfirm(
        'Reset to Default Configuration?',
        'This will clear your local overrides and restore the default settings from config.js.',
        async () => {
          localStorage.removeItem('HAROLD_SITE_CONFIG');
          localStorage.setItem('HAROLD_CACHE_VERSION', Date.now().toString());
          activeConfig = JSON.parse(JSON.stringify(window.SITE_CONFIG));
          populateForm();
          if (siteSyncChannel) {
            siteSyncChannel.postMessage({ type: 'CACHE_CLEARED', timestamp: Date.now() });
          }
          showToast('Defaults Restored', 'Configuration reset to original defaults and cache cleared.', 'info');
        }
      );
    });

    // Export config.js
    document.getElementById('export-config-btn').addEventListener('click', () => {
      const code = `/**\n * HAROLD TRINIDAD - CENTRALIZED WEBSITE CONFIGURATION\n */\n\nwindow.SITE_CONFIG = ${JSON.stringify(activeConfig, null, 2)};\n`;
      const blob = new Blob([code], { type: 'application/javascript' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'config.js';
      a.click();
      showToast('config.js Downloaded!', 'Replace config.js in your project folder and push to GitHub to publish for all visitors.', 'success', 5000);
    });

    populateForm();
    } // end bootAdmin

    /* ==========================================
       EMAIL OTP SECURITY CONTROLLER
       The dashboard is only mounted (bootAdmin) after a valid OTP.
       The OTP itself is never kept in memory in plain text: only a salted hash.
       NOTE: this is a client-side lock on a static site. See README note: real
       protection of publishing comes from the GitHub token that only lives in Harold's browser.
       ========================================== */
    const adminEmail = (activeConfig.adminSecurity && activeConfig.adminSecurity.adminEmail)
                       || "haroldcalo.trinidad@gmail.com";
    const SESSION_KEY = 'HAROLD_ADMIN_SESSION_EXP';
    const SESSION_MS = 30 * 60 * 1000;
    const MAX_TRIES = 5;
    let otpHash = null, otpSalt = '', otpExpiresAt = 0, otpTries = 0, cooldownTimer = null;

    const overlay = document.getElementById('otp-lock-overlay');
    const sendOtpBtn = document.getElementById('send-otp-btn');
    const verifyOtpBtn = document.getElementById('verify-otp-btn');
    const otpInput = document.getElementById('otp-code-input');
    const statusMsg = document.getElementById('otp-status-msg');
    const timerMsg = document.getElementById('otp-timer-msg');

    sessionStorage.removeItem('HAROLD_ADMIN_AUTHENTICATED'); // retire old forgeable flag

    async function sha256Hex(text) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    function say(msg, color) { statusMsg.textContent = msg; statusMsg.style.color = color; }
    function unlock() {
      sessionStorage.setItem(SESSION_KEY, String(Date.now() + SESSION_MS));
      overlay.style.display = 'none';
      bootAdmin();
    }

    if (Number(sessionStorage.getItem(SESSION_KEY) || 0) > Date.now()) {
      unlock();
    } else {
      overlay.style.display = 'flex';
    }

    // Send 6-Digit OTP
    sendOtpBtn.addEventListener('click', async () => {
      const code = String(100000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 900000));
      otpSalt = Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, '0')).join('');
      otpHash = await sha256Hex(otpSalt + code);
      otpExpiresAt = Date.now() + (5 * 60 * 1000);
      otpTries = 0;
      otpInput.value = '';
      say('Sending 6-digit OTP code to ' + adminEmail + '...', '#FFFFFF');

      const sec = activeConfig.adminSecurity || {};
      const publicKey = sec.emailjsPublicKey || "1fzy7njkATDe4UUfw";
      const serviceId = sec.emailjsServiceId || "service_tpm1twd";
      const templateId = sec.emailjsTemplateId || "template_jqqvg4u";
      const templateParams = {
        to_email: adminEmail, email: adminEmail, user_email: adminEmail, recipient: adminEmail,
        to_name: "Harold Trinidad", otp_code: code, passcode: code, time: "5 minutes",
        artist_name: activeConfig.artist?.name || "Harold Trinidad"
      };

      if (window.emailjs) {
        emailjs.send(serviceId, templateId, templateParams, publicKey)
          .then(() => say('✓ 6-Digit OTP Code sent to ' + adminEmail + '! Please check your email inbox.', '#22c55e'))
          .catch((err) => say('❌ EmailJS Error (' + (err.status || 400) + '): ' + (err.text || err.message || JSON.stringify(err)), '#ef4444'));
      } else {
        say('❌ EmailJS SDK script not loaded. Please check internet connection.', '#ef4444');
      }

      let seconds = 60;
      sendOtpBtn.disabled = true;
      timerMsg.style.display = 'block';
      if (cooldownTimer) clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        seconds--;
        timerMsg.textContent = 'Resend available in ' + seconds + 's';
        if (seconds <= 0) {
          clearInterval(cooldownTimer);
          sendOtpBtn.disabled = false;
          timerMsg.style.display = 'none';
        }
      }, 1000);
    });

    // Verify OTP (max 5 wrong tries per code)
    verifyOtpBtn.addEventListener('click', async () => {
      const inputCode = otpInput.value.trim();
      if (!inputCode) return say('Please enter the 6-digit code sent to your email inbox', '#ef4444');
      if (!otpHash || Date.now() > otpExpiresAt) {
        return say('OTP code expired or not generated. Please click "Send 6-Digit OTP Code to Gmail"', '#ef4444');
      }
      if (otpTries >= MAX_TRIES) {
        otpHash = null;
        return say('Too many wrong attempts. Please request a new code.', '#ef4444');
      }
      otpTries++;
      if (await sha256Hex(otpSalt + inputCode) === otpHash) {
        otpHash = null; // single use
        say('✓ Verification Successful! Accessing Admin Dashboard...', '#22c55e');
        setTimeout(unlock, 400);
      } else {
        say('❌ Invalid OTP Code (' + (MAX_TRIES - otpTries) + ' tries left).', '#ef4444');
      }
    });
  </script>
</body>
